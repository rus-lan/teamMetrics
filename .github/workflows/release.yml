name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0, 1.1.0). Leave empty to use the VERSION file.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry-run (build + smoke-test only, no tag/release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Resolve version
        id: version
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$FILE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION, VERSION file: $FILE_VERSION)"

      - name: Build release bundle
        run: scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Verify artifacts
        run: |
          ls -la dist/release/
          test -f dist/release/team-metrics.tar.gz
          test -f dist/release/install.sh
          test -f dist/release/checksums-sha256.txt
          grep -q "team-metrics.tar.gz" dist/release/checksums-sha256.txt
          grep -q "install.sh" dist/release/checksums-sha256.txt

      - name: Smoke-test the tarball
        run: |
          TMP_DIR="$(mktemp -d)"
          tar xzf dist/release/team-metrics.tar.gz -C "$TMP_DIR"
          test -x "$TMP_DIR/team-metrics/scripts/team-metrics"
          "$TMP_DIR/team-metrics/scripts/team-metrics" --version

      - name: Check install.sh syntax
        run: sh -n dist/release/install.sh

      - name: Dry-run stop
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry-run complete. Artifacts built in dist/release/ -- no tag/release created."

      - name: Configure git identity
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/release/team-metrics.tar.gz \
            dist/release/install.sh \
            dist/release/checksums-sha256.txt \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "See CHANGELOG.md for details: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          retention-days: 14
